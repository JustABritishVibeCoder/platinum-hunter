[package]
name = "platinum-hunter"
version = "1.0.0"
description = "Platinum Hunter: PlayStation trophy tracking and Platinum hunting"
authors = ["Platinum Hunter"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "platinum_hunter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
# native-tls uses Windows SChannel, so no extra C toolchain (cmake/nasm) is needed.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "query", "http2", "charset"] }
keyring = { version = "3.6", features = ["windows-native"] }
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
sha2 = "0.11"
base64 = "0.23"
url = "2"
discord-rich-presence = "1.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
